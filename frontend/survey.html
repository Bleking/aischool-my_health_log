<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건강 기록 입력</title>

    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .survey-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(10px);
        }

        h1 { margin-top: 0; }

        .description {
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .optional {
            font-size: 13px;
            font-weight: normal;
            opacity: 0.85;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        input:focus { border: 2px solid #ffffff; }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #5b4bb7;
        }

        button:hover { background: #f1efff; }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        #logout-button {
            margin-top: 14px;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        #message {
            min-height: 24px;
            margin-top: 16px;
            text-align: center;
        }
        
        #survey-form {
            max-width: 700px;
            margin: 0 auto;
        }
        
        .history-section {
            margin-top: 42px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }
        
        .history-header h2 {
            margin: 0 0 6px;
        }
        
        #history-summary {
            margin: 0;
            opacity: 0.9;
        }
        
        .secondary-button {
            width: auto;
            min-width: 120px;
            margin: 0;
            padding: 11px 16px;
        
            background: rgba(255, 255, 255, 0.18);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .secondary-button:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        
        .comparison-area {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
        
            gap: 12px;
            margin-bottom: 18px;
        }
        
        .comparison-card {
            padding: 16px;
            border-radius: 10px;
            background: white;
            color: #222;
        }
        
        .comparison-label {
            margin-bottom: 7px;
            color: #666;
            font-size: 13px;
            font-weight: bold;
        }
        
        .comparison-value {
            font-size: 16px;
            font-weight: bold;
        }
        
        .history-table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            background: white;
        }
        
        .history-table {
            width: 100%;
            min-width: 1350px;
            border-collapse: collapse;
            color: #222;
        }
        
        .history-table th,
        .history-table td {
            padding: 12px 11px;
            border-bottom: 1px solid #e7e7e7;
        
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
        }
        
        .history-table th {
            background: #5b4bb7;
            color: white;
        }
        
        .history-table tbody tr:hover {
            background: #f5f3ff;
        }
        
        .history-table .memo-cell {
            max-width: 220px;
            overflow: hidden;
            text-align: left;
            text-overflow: ellipsis;
        }
        
        .status-badge {
            display: inline-block;
            min-width: 68px;
            padding: 6px 10px;
        
            border-radius: 999px;
            background: #ede9ff;
            color: #5b4bb7;
        
            font-size: 14px;
            font-weight: bold;
        }
        
        .empty-history-cell {
            padding: 34px;
            text-align: center;
            color: #666;
        }
        
        #history-error-message {
            min-height: 24px;
            margin-top: 14px;
            color: #ffe2e2;
            font-weight: bold;
        }
        
        @media (max-width: 900px) {
            .comparison-area {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }
        
        @media (max-width: 600px) {
            .survey-container {
                width: 100%;
                padding: 20px;
            }
        
            .history-header {
                flex-direction: column;
                align-items: stretch;
            }
        
            .secondary-button {
                width: 100%;
            }
        
            .comparison-area {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="survey-container">
        <h1>건강 기록 입력</h1>
        <p id="welcome-message"></p>

        <p class="description">
            필수 건강 수치를 입력하면 BMI, 혈압, 공복 혈당 상태를 확인할 수 있습니다.
        </p>

        <form id="survey-form">
            <div class="form-group">
                <label for="weight">몸무게 (kg)</label>
                <input id="weight" name="weight" type="number"
                       min="1" max="500" step="0.1"
                       placeholder="예: 70.5" required>
            </div>

            <div class="form-group">
                <label for="height">키 (cm)</label>
                <input id="height" name="height" type="number"
                       min="30" max="250" step="0.1"
                       placeholder="예: 175" required>
            </div>

            <div class="form-group">
                <label for="systolic">수축기 혈압 (mmHg)</label>
                <input id="systolic" name="systolic" type="number"
                       min="40" max="300" step="1"
                       placeholder="예: 120" required>
            </div>

            <div class="form-group">
                <label for="diastolic">이완기 혈압 (mmHg)</label>
                <input id="diastolic" name="diastolic" type="number"
                       min="20" max="200" step="1"
                       placeholder="예: 80" required>
            </div>

            <div class="form-group">
                <label for="blood_sugar">공복 혈당 (mg/dL)</label>
                <input id="blood_sugar" name="blood_sugar" type="number"
                       min="20" max="1000" step="1"
                       placeholder="예: 95" required>
            </div>

            <div class="form-group">
                <label for="steps">
                    걸음 수 <span class="optional">(선택)</span>
                </label>
                <input id="steps" name="steps" type="number"
                       min="0" step="1" placeholder="예: 8000">
            </div>

            <div class="form-group">
                <label for="sleep_hours">
                    수면 시간 <span class="optional">(선택)</span>
                </label>
                <input id="sleep_hours" name="sleep_hours" type="number"
                       min="0" max="24" step="0.1" placeholder="예: 7.5">
            </div>

            <div class="form-group">
                <label for="memo">
                    메모 <span class="optional">(선택)</span>
                </label>
                <input id="memo" name="memo" type="text"
                       maxlength="300" placeholder="특이사항을 입력하세요">
            </div>

            <button id="submit-button" type="submit">제출하기</button>
        </form>
        
        <section class="history-section">
            <div class="history-header">
                <div>
                    <h2>나의 건강 기록</h2>
        
                    <p id="history-summary">
                        이전 건강 기록을 불러오는 중입니다.
                    </p>
                </div>
        
                <button
                    id="refresh-history-button"
                    class="secondary-button"
                    type="button"
                >
                    새로고침
                </button>
            </div>
        
            <div
                id="comparison-area"
                class="comparison-area"
            ></div>
        
            <div class="history-table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>검사일</th>
                            <th>몸무게</th>
                            <th>BMI</th>
                            <th>BMI 분류</th>
                            <th>혈압</th>
                            <th>혈압 분류</th>
                            <th>공복 혈당</th>
                            <th>당뇨 분류</th>
                            <th>걸음 수</th>
                            <th>수면 시간</th>
                            <th>메모</th>
                        </tr>
                    </thead>
        
                    <tbody id="history-table-body">
                    </tbody>
                </table>
            </div>
        
            <p id="history-error-message"></p>
        </section>
        
        <p id="message"></p>
        <button id="logout-button" type="button">로그아웃</button>
    </main>

    <script>
        const userId = Number(sessionStorage.getItem("user_id"));
        const userName = sessionStorage.getItem("user_name");
        const isAdmin = sessionStorage.getItem("is_admin") === "true";
        
        if (
            !Number.isInteger(userId) ||
            userId <= 0 ||
            !userName
        ) {
            alert("로그인이 필요합니다.");
            sessionStorage.clear();
            window.location.href = "/";
        }
        else if (isAdmin) {
            window.location.href = "/admin";
        }
        else {
            document
                .getElementById("welcome-message")
                .textContent =
                    `${userName}님, 환영합니다.`;
        }

        function getLocalDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function readOptionalNumber(id, defaultValue) {
            const raw = document.getElementById(id).value.trim();
            return raw === "" ? defaultValue : Number(raw);
        }

        const surveyForm = document.getElementById("survey-form");
        const submitButton = document.getElementById("submit-button");
        const messageElement = document.getElementById("message");

        surveyForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!surveyForm.reportValidity()) {
                return;
            }

            const payload = {
                user_id: Number(userId),
                date: getLocalDateString(),
                weight: Number(document.getElementById("weight").value),
                height: Number(document.getElementById("height").value),
                systolic: Number(document.getElementById("systolic").value),
                diastolic: Number(document.getElementById("diastolic").value),
                blood_sugar: Number(document.getElementById("blood_sugar").value),
                steps: readOptionalNumber("steps", 0),
                sleep_hours: readOptionalNumber("sleep_hours", 0.0),
                memo: document.getElementById("memo").value.trim()
            };

            submitButton.disabled = true;
            submitButton.textContent = "저장 중...";
            messageElement.textContent = "";

            try {
                const response = await fetch(`/records/${userId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    const detail = Array.isArray(result.detail)
                        ? result.detail.map(item => item.msg).join("\n")
                        : result.detail;

                    throw new Error(detail || "건강 기록 저장에 실패했습니다.");
                }

                const resultData = {
                    user_id: Number(userId),
                    user_name: userName,
                    date: payload.date,
                    weight: payload.weight,
                    height: payload.height,
                    systolic: payload.systolic,
                    diastolic: payload.diastolic,
                    blood_sugar: payload.blood_sugar,
                    bmi: result.bmi,
                    bmi_category: result.bmi_category,
                    blood_pressure_warning: result.blood_pressure_warning,
                    blood_sugar_warning: result.blood_sugar_warning
                };

                sessionStorage.setItem(
                    "health_result",
                    JSON.stringify(resultData)
                );

                window.location.href = "/result";

            } catch (error) {
                console.error(error);
                messageElement.textContent = error.message;
                alert(error.message);

            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "제출하기";
            }
        });

        document
            .getElementById("logout-button")
            .addEventListener("click", () => {
                sessionStorage.clear();
                window.location.href = "/";
            });

        const historyTableBody =
            document.getElementById(
                "history-table-body"
            );
        
        const historySummary =
            document.getElementById(
                "history-summary"
            );
        
        const historyErrorMessage =
            document.getElementById(
                "history-error-message"
            );
        
        const comparisonArea =
            document.getElementById(
                "comparison-area"
            );
        
        function escapeHtml(value) {
            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }
        
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
        
        function displayHistoryValue(
            value,
            unit = ""
        ) {
            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "-";
            }
        
            return `${value}${unit}`;
        }
        
        function formatHistoryDate(dateValue) {
            if (!dateValue) {
                return "-";
            }
        
            const date = new Date(
                `${dateValue}T00:00:00`
            );
        
            if (Number.isNaN(date.getTime())) {
                return dateValue;
            }
        
            return date.toLocaleDateString("ko-KR");
        }
    </script>
</body>
</html>
